  type: "KNOWLEDGE_BASE"
  name: "Corporate Travel and Expense Policy 2026"

sections:
  - section_id: "SEC_MEALS"
    title: "Meal Expenses"
    content: "Breakfast is capped at 15 EUR, Lunch at 25 EUR, Dinner at 40 EUR. Alcohol is strictly non-refundable."
  - section_id: "SEC_TRAVEL"
    title: "Travel Class"
    content: "Train travel within Europe must be Second Class unless total duration exceeds 4 hours."
  - section_id: "SEC_FRAUD_PREVENTION"
    title: "Fraud and Misuse Policy"
    content: "The company maintains a zero-tolerance policy for fraud. Expenses for personal gains, high-value luxury services (e.g., Jacuzzis, luxury spa), or vaguely described high-amount items are considered suspicious and will be ESCALATED to the Finance Manager."

relationships:
  governs:
    - "agent_expense_approver"
